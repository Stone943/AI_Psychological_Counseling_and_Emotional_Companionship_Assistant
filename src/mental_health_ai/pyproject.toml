[project]
name = "mental_health_ai"
version = "0.1.0"
description = "AI safety algorithms and deterministic orchestration for mental health platform"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
ai = [
    "torch>=2.5.0",
    "transformers>=4.47.0",
]
onnx-export = [
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
    "optimum[onnxruntime]>=1.23.0",
]
tensorrt = [
    "tensorrt>=10.0.0",
    "cuda-python>=12.0.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
