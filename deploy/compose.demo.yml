# Docker Compose for demo/production — Aliyun ECS x86_64 Ubuntu 24.04 LTS
# Caddy terminates TLS. API runs single replica/worker with A package in-process.
# Secrets injected via external files, never in env or image.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      ENVIRONMENT: demo
      DATABASE_URL: "mysql+asyncmy://mental_health:${MYSQL_PASSWORD}@mysql:3306/mental_health"
      REDIS_URL: "redis://redis:6379/0"
      ENCRYPTION_KEY_REF: /run/secrets/encryption_key
      JWT_SECRET_KEY: /run/secrets/jwt_secret
      REFRESH_TOKEN_SECRET: /run/secrets/refresh_secret
      FORCE_TLS: "true"
      CORS_ORIGINS: '["https://localhost"]'
    secrets:
      - encryption_key
      - jwt_secret
      - refresh_secret
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mental_health
      MYSQL_USER: mental_health
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "mysql+asyncmy://mental_health:${MYSQL_PASSWORD}@mysql:3306/mental_health"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

secrets:
  encryption_key:
    file: ${ENCRYPTION_KEY_FILE:-/dev/null}
  jwt_secret:
    file: ${JWT_SECRET_FILE:-/dev/null}
  refresh_secret:
    file: ${REFRESH_SECRET_FILE:-/dev/null}

volumes:
  caddy-data:
  mysql-data:
  redis-data:
