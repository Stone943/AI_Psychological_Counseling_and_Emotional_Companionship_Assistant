[project]
name = "mental_health_ai"
version = "0.1.0"
description = "AI safety algorithms and deterministic orchestration for mental health platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
ai = [
    "torch>=2.5.0",
    "transformers>=4.47.0",
]
onnx-export = [
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
    "optimum[onnxruntime]>=1.23.0",
]
tensorrt = [
    # The NVIDIA runtime libraries come from the pinned CUDA/TensorRT image.
    # Keeping only Python bindings in the lock avoids downloading GPU libraries
    # on a standard CPU clean clone.
    "tensorrt-cu12-bindings==10.16.1.11; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cuda-python>=12.9,<13; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mental_health_ai"]
